
name: Deploy Fourbeat WebGL

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Private Unity build run ID"
        required: true
        type: string
      source_sha:
        description: "Source commit SHA"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy WebGL to GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Private WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: Fourbeat-WebGL
          repository: mp15-fourbeat/project
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.WEBGL_ARTIFACT_READ_TOKEN }}
          path: ./webgl

      - name: Verify WebGL Build
        shell: bash
        run: |
          test -f ./webgl/index.html || {
            echo "ERROR: index.html not found."
            exit 1
          }

          echo "Source SHA: ${{ inputs.source_sha }}"
          du -sh ./webgl

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./webgl

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
